---
name: ci

on:
  pull_request:
  push:
    paths-ignore: ["sites.toml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
